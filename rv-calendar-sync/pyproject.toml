[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rv-calendar-sync"
version = "0.1.0"
description = "Two-way calendar sync for RV rentals across Booking.com, RVshare, Outdoorsy, Wix Hotels, and manual entries."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CREST" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "icalendar>=5.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dateutil>=2.8",
    "typer>=0.12",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
rv-sync = "rv_calendar_sync.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
